name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller build

      - name: Build exe (PyInstaller, onedir)
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name PDF2Pic --icon app.ico
          --exclude-module numpy --exclude-module numpy.libs
          --exclude-module matplotlib --exclude-module scipy
          --exclude-module pandas pdf2pic.py

      - name: Build wheel
        run: python -m build --wheel --outdir release

      - name: Package portable + source zip and checksums
        run: python package.py

      - name: Show artifacts
        run: dir release

      - uses: actions/upload-artifact@v4
        with:
          name: PDF2Pic-windows
          path: release/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
